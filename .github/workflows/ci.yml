name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinica
          POSTGRES_PASSWORD: clinica_ci
          POSTGRES_DB: clinica_turnos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinica -d clinica_turnos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clinica:clinica_ci@localhost:5432/clinica_turnos
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      SEED_PASSWORD: Demo1234!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
